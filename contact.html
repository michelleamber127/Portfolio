<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in touch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="portfolio-container">
    <header>
      <a href="index.html" class="logo">mag.<span>html</span></a>
      <div class="nav-container">
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">MyWorks</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>Get in Touch</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Have a project inquiry, collaboration proposal, or question? Send a message below.</p>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Mikel Jaksun" required>
          </div>

          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. name@domain.com" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="What would you like to tell me?" required></textarea>
          </div>

          <button type="submit" class="btn" style="width: 100%; text-align: center; margin-top: 0.5rem;">Send Message</button>
        </form>

        <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.2rem; text-align: center; font-size: 0.9rem;">
          <p style="color: var(--text-muted);">Direct Contact &amp; Profiles:</p>
          <p style="margin-top: 0.5rem;">
            <a href="mailto:garcia.michelleamber@gmail.com" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">garcia.michelleamber@gmail.com</a> | 
            <a href="https://github.com/michelleamber127" target="_blank" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">GitHub</a> | 
            <a href="https://www.linkedin.com/in/michelle-amber-garcia-99686a408/?isSelfProfile=true" target="_blank" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">LinkedIn</a>
          </p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Michelle Amber Garcia.</p>
    </footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
